<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <style>
        body {
            background-color: #f4f4f4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        .auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); display: flex; justify-content: center; align-items: center; z-index: 999;
        }
        .auth-modal {
            background: #fff; width: 420px; border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25); padding: 24px; box-sizing: border-box;
        }
        .auth-title { font-size: 19px; font-weight: 500; color: #202124; margin: 0 0 20px 0; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 12px; color: #5f6368; margin-bottom: 6px; }
        .auth-input {
            width: 100%; padding: 10px; border: 1px solid #dadce0; border-radius: 4px;
            font-size: 14px; box-sizing: border-box; outline: none;
        }
        .auth-input:focus { border-color: #1a73e8; }
        .buttons-group { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }
        .btn {
            padding: 9px 16px; font-size: 14px; font-weight: 500; border-radius: 4px;
            cursor: pointer; border: 1px solid #dadce0; background: #fff; color: #1a73e8;
        }
        .btn-primary { background: #1a73e8; color: #fff; border: none; }
        .btn-primary:hover { background: #1557b0; }
        #error-txt { color: #d93025; font-size: 13px; margin-top: 10px; display: none; }

        /* Секретные буквы-пасхалки */
        .secret-letter {
            cursor: default;
            color: inherit;
        }
        .secret-letter:active {
            color: #1a73e8; /* Слегка подсветится только при самом клике */
        }

        /* Уведомление о копировании */
        .toast {
            position: fixed; bottom: 20px; background: #323232; color: #fff;
            padding: 12px 24px; border-radius: 4px; font-size: 14px;
            display: none; z-index: 1000; box-shadow: 0 3px 5px rgba(0,0,0,0.3);
        }

        .secret-content { display: none; flex-direction: column; align-items: center; background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
        .secret-content img { max-width: 100%; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="auth-overlay" id="auth-popup">
        <div class="auth-modal">
            <h2 class="auth-title">Вход</h2>
            
            <div class="input-group">
                <!-- Замаскировали «а» в слове Имя -->
                <label for="username">Им<span class="secret-letter" onclick="copySecret('a.mp3')">я</span> пользователя</label>
                <input type="text" id="username" class="auth-input" autocomplete="off" autofocus>
            </div>
            <div class="input-group">
                <!-- Замаскировали «б» в слове Пароль (буква 'о' заменена визуально) -->
                <label for="password">Пар<span class="secret-letter" onclick="copySecret('b.mp3')">о</span>ль</label>
                <input type="password" id="password" class="auth-input">
            </div>
            
            <div id="error-txt">Неверный логин или пароль.</div>

            <div class="buttons-group">
                <button class="btn" onclick="document.getElementById('username').value=''; document.getElementById('password').value='';">Отмена</button>
                <button class="btn btn-primary" onclick="validateCredentials()">Вход</button>
            </div>
        </div>
    </div>

    <div class="secret-content" id="secret-screen">
        <img src="artifact.jpg" alt="artifact">
    </div>

    <!-- Всплывашка для логов -->
    <div class="toast" id="toast">Ссылка на аудио-лог скопирована в буфер обмена.</div>

<script>
    const CORRECT_USER = "ADMIN_H8oI0e8IY";
    const CORRECT_PASS = "hO93S13lD";

    // Функция, которая копирует прямую ссылку на файл другу в буфер обмена без скачивания
    function copySecret(fileName) {
        // Формируем полную ссылку на файл на твоем гитхабе
        const fullUrl = window.location.origin + window.location.pathname + fileName;
        
        navigator.clipboard.writeText(fullUrl).then(() => {
            const toast = document.getElementById('toast');
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        });
    }

    function validateCredentials() {
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        const error = document.getElementById('error-txt');

        if (user === CORRECT_USER && pass === CORRECT_PASS) {
            document.getElementById('auth-popup').style.display = 'none';
            document.getElementById('secret-screen').style.display = 'flex';
        } else {
            error.style.display = 'block';
            document.getElementById('password').value = '';
        }
    }
</script>

</body>
</html>
