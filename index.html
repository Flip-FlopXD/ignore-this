<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <style>
        body {
            background-color: #f4f4f4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 0;
            height: 100vh;
            display: flex; justify-content: center; align-items: center;
            position: relative;
        }

        /* Симуляция окна HTTP Basic Auth */
        .auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); display: flex; justify-content: center; align-items: center; z-index: 999;
        }
        .auth-modal {
            background: #fff; width: 420px; border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25); padding: 24px; box-sizing: border-box;
        }
        .auth-title { font-size: 19px; font-weight: 500; color: #202124; margin: 0 0 20px 0; }
        
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 12px; color: #5f6368; margin-bottom: 6px; }
        .auth-input {
            width: 100%; padding: 10px; border: 1px solid #dadce0; border-radius: 4px;
            font-size: 14px; box-sizing: border-box; outline: none;
        }
        .auth-input:focus { border-color: #1a73e8; }
        
        .buttons-group { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }
        .btn {
            padding: 9px 16px; font-size: 14px; font-weight: 500; border-radius: 4px;
            cursor: pointer; border: 1px solid #dadce0; background: #fff; color: #1a73e8;
        }
        .btn-primary { background: #1a73e8; color: #fff; border: none; }
        .btn-primary:hover { background: #1557b0; }
        .btn:not(.btn-primary):hover { background: #f8f9fa; color: #174ea6; }

        #error-txt { color: #d93025; font-size: 13px; margin-top: 10px; display: none; }

        /* Тайная зона в самом низу страницы */
        .hidden-zone {
            position: absolute; bottom: 10px; left: 10px; opacity: 0.15; font-size: 11px;
        }
        .hidden-zone a {
            color: #5f6368; text-decoration: none; margin-right: 15px;
            pointer-events: none; cursor: default; /* Нажать нельзя */
        }

        /* Экран со стеганографией после успешного ввода */
        .secret-content {
            display: none; flex-direction: column; align-items: center;
            background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ddd;
        }
        .secret-content img { max-width: 100%; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- Окно авторизации -->
    <div class="auth-overlay" id="auth-popup">
        <div class="auth-modal">
            <h2 class="auth-title">Вход</h2>
            
            <div class="input-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" class="auth-input" autocomplete="off" autofocus>
            </div>
            <div class="input-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" class="auth-input">
            </div>
            
            <div id="error-txt">Неверный логин или пароль.</div>

            <div class="buttons-group">
                <button class="btn" onclick="document.getElementById('username').value=''; document.getElementById('password').value='';">Отмена</button>
                <button class="btn btn-primary" onclick="validateCredentials()">Вход</button>
            </div>
        </div>
    </div>

    <!-- Результат (Стеганография) -->
    <div class="secret-content" id="secret-screen">
        <!-- Сюда вставь прямую ссылку на картинку, в которой зашит Base64 -->
        <img src="https://drive.google.com/file/d/1GtfyiMQ6xP4XFQu3B5Cs_tWghVXyTXuG/view?usp=sharing" alt="artifact">
    </div>

    <!-- Скрытые незаметные ссылки без возможности клика -->
    <div class="hidden-zone">
        <!-- Замени URL на реальные ссылки на свои .wav файлы спектрограмм -->
        <a href="a.mp3">а</a>
        <a href="b.mp3">б</a>
    </div>

<script>
    // Настройки авторизации из спектрограмм
    const CORRECT_USER = "ADMIN_H8oI0e8IY";
    const CORRECT_PASS = "hO93S13lD";

    function validateCredentials() {
        const user = document.getElementById('username').value.trim().toLowerCase();
        const pass = document.getElementById('password').value.trim().toLowerCase();
        const error = document.getElementById('error-txt');

        if (user === CORRECT_USER && pass === CORRECT_PASS) {
            document.getElementById('auth-popup').style.display = 'none';
            document.getElementById('secret-screen').style.display = 'flex';
        } else {
            error.style.display = 'block';
            document.getElementById('password').value = '';
        }
    }
</script>

</body>
</html>
